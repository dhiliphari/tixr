services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tixr
      POSTGRES_PASSWORD: pa55word
      POSTGRES_DB: tixr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tixr -d tixr"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata: